name: sdtv
description: Steam Deck–first IPTV player (TiviMate-like, controller-native).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  sdtv_core:
    path: ../../packages/sdtv_core
  sdtv_input:
    path: ../../packages/sdtv_input
  sdtv_player:
    path: ../../packages/sdtv_player

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
