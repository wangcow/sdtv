name: sdtv
description: Steam Deck–first IPTV player (TiviMate-like, controller-native).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  sdtv_core:
    path: ../../packages/sdtv_core
  sdtv_input:
    path: ../../packages/sdtv_input
  sdtv_player:
    path: ../../packages/sdtv_player
  shared_preferences: ^2.5.3
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/mock_xtream/
